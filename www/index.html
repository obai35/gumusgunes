<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <title>Gümüş Güneş</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1628;
      color: #e8e9ed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(192,197,206,0.15);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #e8e9ed;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: rgba(192,197,206,0.6);
      max-width: 280px;
      line-height: 1.5;
    }
    .brand {
      margin-bottom: 32px;
    }
    .brand span {
      display: block;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="brand">
    <span>Gümüş Güneş</span>
  </div>
  <div class="loader"></div>
  <h1>Connecting to the collection…</h1>
  <p>Please ensure you have an internet connection to browse our handcrafted pieces.</p>
</body>
</html>
